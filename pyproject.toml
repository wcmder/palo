[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palo-workspace-cli"
version = "0.1.0"
description = "Run PAN-OS Terraform environments with OS keyring credentials"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["keyring>=25.0.0,<26.0.0"]

[project.scripts]
palo = "palo_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
